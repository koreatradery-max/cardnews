name: 카드뉴스 관리 (재전송·일괄 업로드)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'status=상태 확인 / resend=텔레그램 미전송 세트 재전송 / bulk=재전송 + 아직 안 올라간 세트 일괄 업로드(반려 제외)'
        type: choice
        options: [status, resend, bulk]
        default: status

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARDNEWS_KEY: ${{ secrets.CARDNEWS_KEY }}
      CARDNEWS_WORKER_URL: ${{ vars.CARDNEWS_WORKER_URL || 'https://tg-login.korea-trader-y.workers.dev' }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p _media
          git fetch -q --depth=1 origin media && git archive FETCH_HEAD | tar -x -C _media
          python run.py admin _media ${{ inputs.mode }}
