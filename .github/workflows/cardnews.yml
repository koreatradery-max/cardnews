name: 카드뉴스 자동화

on:
  # 30분마다 실행 (한국 시간 03:00~05:00 제외 → 02:30 마지막, 05:30 첫 회차)
  # 한국 시간 = UTC+9 → UTC 18·19시(=한국 3·4시)와 UTC 20:00(=한국 5:00)을 뺀다
  schedule:
    - cron: '0,30 0-17,21-23 * * *'
    - cron: '30 20 * * *'
  # Cloudflare Worker(tg-login)도 한국 시간 8~22시 정각마다 workflow_dispatch 로 호출한다 (GitHub 예약이 늦을 때 보완)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cardnews
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}          # 선택 (NAVER API HUB)
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}  # 선택
      CARDNEWS_KEY: ${{ secrets.CARDNEWS_KEY }}
      CARDNEWS_WORKER_URL: ${{ vars.CARDNEWS_WORKER_URL || 'https://tg-login.korea-trader-y.workers.dev' }}
      CARDNEWS_MODEL: ${{ vars.CARDNEWS_MODEL }}
      CARDNEWS_AUTO_ALL: '1'          # 모든 회차 승인 없이 바로 업로드 (민감 주제만 승인 대기)
      CARDNEWS_SETS: '1'              # 30분마다 1세트 (인스타그램 API 게시 한도: 24시간 50건)
      TZ: Asia/Seoul
    steps:
      - name: 중복 실행 방지 (예약 실행과 Worker 호출이 겹치면 한 번만)
        id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d '-12 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/cardnews.yml/runs" -f created=">${since}" -F per_page=20 \
                -q "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID} and .conclusion != \"cancelled\" and .conclusion != \"skipped\")] | length" || echo 0)
          echo "최근 12분 안의 다른 실행: $n"
          if [ "$n" = "0" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "::notice::직전 회차와 겹쳐 건너뜁니다."; fi

      - name: 키 확인 (아직 등록 전이면 조용히 종료)
        id: keys
        if: steps.dup.outputs.go == '1'
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$CARDNEWS_KEY" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::키가 아직 등록되지 않아 실행하지 않았습니다."
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == '1'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ready == '1'
        with:
          python-version: '3.12'
      - run: pip install -q pillow
        if: steps.keys.outputs.ready == '1'

      - name: 이슈 수집 · 문구 작성 · 썸네일 제작
        if: steps.keys.outputs.ready == '1'
        run: python run.py generate

      - name: 다룬 이슈 기록 저장 (중복 제외용)
        if: steps.keys.outputs.ready == '1'
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -qm "cardnews: history $(date +%F\ %R)"
          git push -q

      - name: 이미지 보관 브랜치(media) 갱신 — 최근 3일치만 유지
        if: steps.keys.outputs.ready == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _media
          if git fetch -q --depth=1 origin media 2>/dev/null; then git archive FETCH_HEAD | tar -x -C _media; fi
          python run.py prune _media 72
          find out -maxdepth 1 \( -name '*.jpg' -o -name '*.json' \) ! -name 'pending.json' -exec cp {} _media/ \;
          cd _media
          git init -q -b media
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add -A
          git commit -qm "media $(date +%F\ %R)" --allow-empty
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media
          sleep 10

      - name: 텔레그램 전송 + 바로 인스타그램 자동 업로드
        if: steps.keys.outputs.ready == '1'
        run: python run.py notify
